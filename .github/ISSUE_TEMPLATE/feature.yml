name: Feature request
description: Suggest an improvement to bbonductor
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Workspaces/sidebar
        - Runtime/terminals
        - Linear
        - GitHub/PRs
        - Agent orchestration
        - Configuration
        - Other
